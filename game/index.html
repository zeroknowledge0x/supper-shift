<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supper Shift - a little kitchen rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1412; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #spoken { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720" aria-label="Supper Shift: read the order tickets, chop ingredients, cook, plate and serve before each ticket expires"></canvas>
<p id="spoken" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
